<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover for safe-area insets; lock zoom so rapid taps don't fire browser gestures (Android) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Bit-Hunt — Vault</title>
    <style>
      :root {
        --green: #19ff9b;
        --green-dim: #0c7a4a;
        --panel: rgba(6, 18, 12, 0.72);
        --stroke: rgba(25, 255, 155, 0.35);
        --text: #cffce6;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #04080a;
        overflow: hidden;
        /* touch-action is what actually fixes iOS rapid-tap zoom */
        touch-action: manipulation;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: var(--text);
        -webkit-user-select: none;
        user-select: none;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; touch-action: manipulation; }

      /* ---------- HUD: CSS overlay, zero Three.js cost, anchored to viewport ---------- */
      #hud {
        position: fixed;
        inset: 0;
        height: 100dvh;
        pointer-events: none; /* clicks fall through to canvas; re-enable per-control */
        z-index: 10;
      }

      /* Crosshair */
      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 22px;
        height: 22px;
        margin: -11px 0 0 -11px;
        opacity: 0.6;
      }
      #crosshair::before, #crosshair::after {
        content: "";
        position: absolute;
        background: var(--green);
        box-shadow: 0 0 6px var(--green);
      }
      #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; margin-left: -1px; }
      #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; margin-top: -1px; }

      /* Top-left status badge */
      #badge {
        position: absolute;
        top: calc(12px + env(safe-area-inset-top));
        left: calc(12px + env(safe-area-inset-left));
        padding: 8px 12px;
        background: var(--panel);
        border: 1px solid var(--stroke);
        border-radius: 10px;
        font-size: 12px;
        line-height: 1.5;
        backdrop-filter: blur(6px);
        text-shadow: 0 0 8px rgba(25, 255, 155, 0.4);
      }
      #badge b { color: var(--green); }
      #returned { color: var(--green); font-weight: 600; margin-top: 2px; }
      #returned.bump { animation: returned-bump 0.28s ease-out; }
      @keyframes returned-bump {
        0% { transform: scale(1); text-shadow: 0 0 8px rgba(25,255,155,0.4); }
        40% { transform: scale(1.22); text-shadow: 0 0 16px rgba(25,255,155,0.95); }
        100% { transform: scale(1); text-shadow: 0 0 8px rgba(25,255,155,0.4); }
      }
      /* countdown timer */
      #timer { color: var(--text); font-weight: 700; font-size: 16px; letter-spacing: 1px; margin-top: 2px; }
      #timer.urgent { color: #ff5a5a; animation: timer-urgent 1s ease-in-out infinite; }
      @keyframes timer-urgent {
        0%, 100% { opacity: 0.7; text-shadow: 0 0 6px rgba(255,90,90,0.4); }
        50% { opacity: 1; text-shadow: 0 0 16px rgba(255,90,90,0.95); }
      }

      /* win/lose overlay */
      #hunt-overlay {
        position: absolute; inset: 0;
        display: none; align-items: center; justify-content: center;
        background: rgba(2, 8, 5, 0.6); backdrop-filter: blur(4px);
        pointer-events: auto; z-index: 30;
      }
      #hunt-overlay.show { display: flex; animation: hunt-fade 0.35s ease-out; }
      @keyframes hunt-fade { from { opacity: 0; } to { opacity: 1; } }
      .hunt-card {
        background: var(--panel); border: 1px solid var(--green);
        border-radius: 16px; padding: 30px 40px; min-width: 300px; text-align: center;
        box-shadow: 0 0 40px rgba(25, 255, 155, 0.2);
      }
      #hunt-overlay.lose .hunt-card { border-color: #ff5a5a; box-shadow: 0 0 40px rgba(255, 90, 90, 0.2); }
      .hunt-card h2 { margin: 0 0 10px; font-size: 26px; letter-spacing: 3px; color: var(--green); }
      #hunt-overlay.lose .hunt-card h2 { color: #ff7a7a; }
      #hunt-sub { color: var(--text); font-size: 15px; margin-bottom: 20px; opacity: 0.9; }
      #hunt-action { font-size: 15px; padding: 12px 22px; }

      /* Bottom control bar (mode switcher + free-look) */
      #controls {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(14px + env(safe-area-inset-bottom));
        display: flex;
        gap: 8px;
        pointer-events: auto;
        flex-wrap: wrap;
        justify-content: center;
        max-width: calc(100vw - 24px);
      }
      button.ctl {
        pointer-events: auto;
        font: inherit;
        font-size: 13px;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--stroke);
        border-radius: 10px;
        padding: 10px 14px;
        cursor: pointer;
        backdrop-filter: blur(6px);
        transition: background 0.15s, border-color 0.15s, opacity 0.15s;
      }
      button.ctl:hover { border-color: var(--green); }
      button.ctl.active { background: var(--green-dim); border-color: var(--green); color: #eafff5; }
      button.ctl[disabled] { opacity: 0.35; cursor: not-allowed; }

      /* Transient controls hint (top-center, fades) */
      #hint {
        position: absolute;
        top: calc(14px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        padding: 7px 12px;
        background: var(--panel);
        border: 1px solid var(--stroke);
        border-radius: 999px;
        font-size: 12px;
        opacity: 0;
        transition: opacity 0.4s;
        white-space: nowrap;
      }
      #hint.show { opacity: 0.9; }

      /* ESC-to-exit hint while pointer-locked */
      #esc-hint {
        position: absolute;
        bottom: calc(70px + env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 12px;
        background: var(--panel);
        border: 1px solid var(--stroke);
        border-radius: 999px;
        font-size: 12px;
        display: none;
      }
      #esc-hint.show { display: block; }

      /* Hide flat-mode HUD bits while in an immersive session */
      body.xr-active #crosshair,
      body.xr-active #controls,
      body.xr-active #hint,
      body.xr-active #esc-hint,
      body.xr-active #joystick,
      body.xr-active #btn-jump,
      body.xr-active #verb-buttons,
      body.xr-active #hunt-overlay { display: none; }

      /* ---------- mobile locomotion controls (shown only on coarse pointers) ---------- */
      #joystick, #btn-jump { display: none; }
      body.mobile #joystick {
        display: block;
        position: absolute;
        left: calc(22px + env(safe-area-inset-left));
        bottom: calc(70px + env(safe-area-inset-bottom));
        width: 120px; height: 120px;
        border-radius: 50%;
        background: rgba(6, 18, 12, 0.5);
        border: 1px solid var(--stroke);
        pointer-events: auto;
        touch-action: none;
      }
      #joystick-knob {
        position: absolute; left: 50%; top: 50%;
        width: 54px; height: 54px; margin: -27px 0 0 -27px;
        border-radius: 50%;
        background: rgba(25, 255, 155, 0.35);
        border: 1px solid var(--green);
      }
      body.mobile #btn-jump {
        display: block;
        position: absolute;
        right: calc(22px + env(safe-area-inset-right));
        bottom: calc(86px + env(safe-area-inset-bottom));
        width: 88px; height: 88px;
        border-radius: 50%;
        background: rgba(6, 18, 12, 0.6);
        color: var(--text); font: 600 14px ui-monospace, monospace;
        border: 1px solid var(--stroke);
        pointer-events: auto; touch-action: none;
      }

      /* mobile game-verb buttons (B / Y) — stacked above the jump button */
      #verb-buttons { display: none; }
      body.mobile #verb-buttons {
        display: flex; flex-direction: column; gap: 8px;
        position: absolute;
        right: calc(28px + env(safe-area-inset-right));
        bottom: calc(186px + env(safe-area-inset-bottom));
        pointer-events: none;
      }
      .verb-btn {
        pointer-events: auto; touch-action: none;
        font: 600 12px ui-monospace, monospace;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--stroke);
        border-radius: 10px;
        padding: 10px 12px;
        backdrop-filter: blur(6px);
      }

      /* builder-mode indicator */
      #builder-indicator {
        position: absolute;
        top: calc(12px + env(safe-area-inset-top));
        right: calc(12px + env(safe-area-inset-right));
        padding: 7px 12px;
        background: var(--panel); border: 1px solid var(--stroke);
        border-radius: 10px; font-size: 12px;
        color: var(--green); opacity: 0; transition: opacity 0.2s;
      }
      #builder-indicator.show { opacity: 1; }

      /* scanner ping flash */
      #scanner-flash {
        position: absolute; inset: 0;
        background: radial-gradient(circle, rgba(25,255,155,0.18), transparent 70%);
        opacity: 0; transition: opacity 0.12s; pointer-events: none;
      }
      #scanner-flash.show { opacity: 1; }

      /* ---------- pause panel (flat / mobile overlay) ---------- */
      #pause-panel {
        position: absolute; inset: 0;
        display: none; align-items: center; justify-content: center;
        background: rgba(2, 8, 5, 0.55); backdrop-filter: blur(3px);
        pointer-events: auto; z-index: 20;
      }
      #pause-panel.show { display: flex; }
      .pause-card {
        background: var(--panel); border: 1px solid var(--green);
        border-radius: 14px; padding: 22px; min-width: 260px;
        box-shadow: 0 0 30px rgba(25, 255, 155, 0.15);
      }
      .pause-card h2 {
        margin: 0 0 14px; color: var(--green); font-size: 18px;
        letter-spacing: 2px; text-align: center;
      }
      .pause-rows { display: flex; flex-direction: column; gap: 8px; }
      .pause-row { width: 100%; text-align: left; }

      .tip { position: relative; }
      .tip[data-tip]:hover::after {
        content: attr(data-tip);
        position: absolute;
        bottom: 120%;
        left: 50%;
        transform: translateX(-50%);
        background: #03110a;
        border: 1px solid var(--stroke);
        color: var(--text);
        font-size: 11px;
        padding: 5px 8px;
        border-radius: 6px;
        white-space: nowrap;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <div id="badge">
        <div>BIT-HUNT · <b id="mode-label">Screen</b></div>
        <div id="status">loading assets…</div>
        <div id="returned">0 / 21 returned</div>
        <div id="timer">4:20</div>
      </div>

      <div id="crosshair"></div>
      <div id="hint">hold-drag to look</div>
      <div id="esc-hint">press <b>ESC</b> to release look</div>
      <div id="builder-indicator">Builder: off</div>
      <div id="scanner-flash"></div>

      <!-- mobile-only locomotion controls -->
      <div id="joystick"><div id="joystick-knob"></div></div>
      <button id="btn-jump" class="touch-btn">JUMP</button>
      <!-- mobile game-verb buttons (shown only while the verb is enabled) -->
      <div id="verb-buttons">
        <button id="btn-builder" class="verb-btn">BUILD</button>
        <button id="btn-scanner" class="verb-btn">SCAN</button>
      </div>

      <div id="controls">
        <button class="ctl tip" id="btn-screen">Screen</button>
        <button class="ctl tip" id="btn-vr">Enter VR</button>
        <button class="ctl tip" id="btn-ar">Enter AR</button>
        <!-- no data-tip here: the dedicated #esc-hint ("press ESC to release look") is the
             single free-look hint; a hover tooltip would overlap it while pointer-locked. -->
        <button class="ctl" id="btn-freelook">Free look: off</button>
        <button class="ctl tip" id="btn-pause" data-tip="Pause / comfort (Left-X · Esc)">☰ Menu</button>
        <button class="ctl tip" id="btn-hunt" data-tip="Burst the vault + scatter sats (H · R resets)">Start Hunt</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
